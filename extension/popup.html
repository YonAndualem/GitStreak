<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitStreak Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="setup-screen" class="screen">
        <h2 class="title" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
            <img src="icons/icon128.png" width="24" height="24" alt="GitHub Logo" style="border-radius: 4px;"/> 
            GitStreak Tracker
        </h2>
        <input type="text" id="username-input" placeholder="GitHub Username" />
        <div id="login-error" class="hidden" style="color: #da3633; font-size: 13px; font-weight: 500; margin-top: -4px;"></div>
        <button id="save-btn">Start Tracking</button>
    </div>

    <div id="stats-screen" class="screen hidden">
        <h2 id="greeting-header" class="greeting"></h2>
        <div id="loading" class="loading">
            <div class="spinner"></div>
        </div>
        <img id="streak-img" class="hidden" src="" alt="GitHub Streak Stats" />
        <button id="copy-btn" class="hidden" style="margin-top: 5px; font-size: 12px; padding: 4px 0px; background: transparent; border: none; color: #8b949e; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 4px;">🔗 Copy Markdown</button>
        <!-- Interactive Native Heatmap -->
        <div id="heatmap-container" class="hidden" style="margin-top: 15px; width: 495px;">
            <div style="font-size: 12px; color: #8b949e; margin-bottom: 8px; text-align: left;">Last 365 Days</div>
            <div id="heatmap-grid" class="heatmap-grid"></div>
        </div>
        
        <!-- Dynamic Status Banner -->
        <div id="status-banner" class="hidden" style="margin-top: 15px; padding: 10px; border-radius: 6px; width: 495px; box-sizing: border-box; text-align: center; font-size: 13px; font-weight: 500;">
        </div>

        <div class="footer">
            <button id="settings-btn" class="text-btn">Logout</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
