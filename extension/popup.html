<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitStreak Tracker</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="setup-screen" class="screen">
        <h2 class="title">GitStreak Tracker</h2>
        <input type="text" id="username-input" placeholder="GitHub Username" />
        <button id="save-btn">Start Tracking</button>
    </div>

    <div id="stats-screen" class="screen hidden">
        <div id="loading" class="loading">Loading live stats...</div>
        
        <div id="streak-card" class="hidden">
            <div class="col">
                <div class="stat-header">Total Contributions</div>
                <div class="stat-value" id="total-contributions">0</div>
                <div class="stat-dates" id="total-dates"></div>
            </div>
            
            <div class="divider"></div>
            
            <div class="col">
                <div class="stat-header">Current Streak</div>
                <div class="ring-container">
                    <svg class="ring" width="84" height="84">
                        <circle class="ring-bg" cx="42" cy="42" r="40" />
                        <circle class="ring-progress" cx="42" cy="42" r="40" id="current-ring" />
                    </svg>
                    <div class="stat-value" id="current-streak">0</div>
                </div>
                <div class="stat-dates" id="current-dates"></div>
            </div>
            
            <div class="divider"></div>
            
            <div class="col">
                <div class="stat-header">Longest Streak</div>
                <div class="stat-value" id="longest-streak">0</div>
                <div class="stat-dates" id="longest-dates"></div>
            </div>
        </div>

        <div class="footer">
            <button id="settings-btn" class="text-btn">Change User</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
