<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitStreak Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="setup-screen" class="screen">
        <h2 class="title" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
            <img src="icons/icon128.png" width="24" height="24" alt="GitHub Logo" style="border-radius: 4px;"/> 
            GitStreak Tracker
        </h2>
        <input type="text" id="username-input" placeholder="GitHub Username" />
        <button id="save-btn">Start Tracking</button>
    </div>

    <div id="stats-screen" class="screen hidden">
        <h2 id="greeting-header" class="greeting"></h2>
        <div id="loading" class="loading">Generating stats...</div>
        <img id="streak-img" class="hidden" src="" alt="GitHub Streak Stats" />
        <div id="action-banner" class="hidden" style="margin-top: 5px; padding: 8px; background: rgba(221, 39, 39, 0.15); border: 1px solid rgba(221, 39, 39, 0.5); border-radius: 6px; width: 495px; box-sizing: border-box; text-align: center; font-size: 13px; color: #ffbaba; font-weight: 500;">
            🔥 Your streak is at risk! You haven't pushed any code today.
        </div>
        
        <!-- Interactive Heatmap -->
        <div id="heatmap-container" class="hidden" style="margin-top: 10px; width: 495px; text-align: center;">
            <img id="heatmap-img" src="" style="width: 100%; border-radius: 4.5px; opacity: 0.9;" />
        </div>

        <div class="footer">
            <button id="settings-btn" class="text-btn">Logout</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
